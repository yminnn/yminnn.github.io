<svg width="300" height="160" viewBox="0 0 300 160" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg { fill: #111111; }
    .text-color { fill: #ffffff; }
    .box-bg { fill: #222222; }
    :root[data-theme='light'] .bg { fill: #f5f5f5; }
    :root[data-theme='light'] .text-color { fill: #333333; }
    :root[data-theme='light'] .box-bg { fill: #ffffff; }

    .stroke-color { stroke: #ffffff; }
    :root[data-theme='light'] .stroke-color { stroke: #333333; }

    .axis-color { stroke: #777777; }
    :root[data-theme='light'] .axis-color { stroke: #999999; }

    .red-block { fill: #ff3333; }
    :root[data-theme='light'] .red-block { fill: #ff3333; opacity: 0.9; }

    .label { font-family: Arial, sans-serif; font-size: 9px; }
    .small-label { font-family: Arial, sans-serif; font-size: 8px; }
  </style>

  <rect width="300" height="160" class="bg"/>

  <text x="20" y="20" class="label text-color" font-weight="bold">BLE / UWB Transceiver</text>

  <!-- axes: x = frequency, y = power spectral density -->
  <line x1="30" y1="120" x2="270" y2="120" class="axis-color" stroke-width="1"/>
  <line x1="30" y1="35" x2="30" y2="120" class="axis-color" stroke-width="1"/>

  <!-- UWB wideband hump (3-10 GHz) -->
  <path d="M110,120 C130,90 150,70 175,68 C200,70 220,90 240,120"
        fill="none" class="stroke-color" stroke-width="1.3"/>
  <text x="175" y="60" class="small-label text-color" text-anchor="middle" opacity="0.8">UWB 3&#8211;10 GHz</text>

  <!-- BLE narrowband spike (2.4 GHz) -->
  <rect x="64" y="42" width="4" height="78" class="red-block"/>
  <text x="66" y="35" class="small-label red-block" fill="#ff3333" text-anchor="middle">BLE 2.4 GHz</text>

  <!-- frequency axis ticks -->
  <text x="66" y="132" class="small-label text-color" text-anchor="middle" opacity="0.7">2.4</text>
  <text x="175" y="132" class="small-label text-color" text-anchor="middle" opacity="0.7">3&#8211;10</text>
  <text x="245" y="132" class="small-label text-color" text-anchor="middle" opacity="0.7">GHz</text>

  <text x="30" y="145" class="small-label text-color">0.8V &#183; 0.8mm&#178; &#183; 40nm CMOS</text>
</svg>
