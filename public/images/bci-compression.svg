  <style>.bg{fill:#111}.ink{fill:#f5f5f5}.muted{fill:#777}.line{stroke:#5d5d5d}.panel{fill:#181818;stroke:#292929}:root[data-theme='light'] .bg{fill:#f5f5f5}:root[data-theme='light'] .ink{fill:#171717}:root[data-theme='light'] .muted{fill:#777}:root[data-theme='light'] .line{stroke:#aaa}:root[data-theme='light'] .panel{fill:#fff;stroke:#ddd}.t{font-family:Inter,Arial,sans-serif}</style>
