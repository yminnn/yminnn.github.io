<svg width="600" height="300" viewBox="0 0 600 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .dark { display: block; }
      .light { display: none; }
      :root[data-theme='light'] .dark { display: none; }
      :root[data-theme='light'] .light { display: block; }
    </style>
  </defs>

  <!-- 深色模式 -->
  <g class="dark">
    <rect width="600" height="300" fill="transparent"/>

    <text x="80" y="30" font-family="Arial, sans-serif" font-size="16" fill="#ffffff" text-anchor="start" font-weight="bold">Citations Over Time</text>

    <line x1="50" y1="250" x2="550" y2="250" stroke="#ffffff" stroke-width="1.5"/>
    <line x1="50" y1="250" x2="50" y2="50" stroke="#ffffff" stroke-width="1.5"/>

    <g opacity="0.2">
      <line x1="50" y1="210" x2="550" y2="210" stroke="#ffffff" stroke-width="0.5" stroke-dasharray="2,2"/>
      <line x1="50" y1="170" x2="550" y2="170" stroke="#ffffff" stroke-width="0.5" stroke-dasharray="2,2"/>
      <line x1="50" y1="130" x2="550" y2="130" stroke="#ffffff" stroke-width="0.5" stroke-dasharray="2,2"/>
      <line x1="50" y1="90" x2="550" y2="90" stroke="#ffffff" stroke-width="0.5" stroke-dasharray="2,2"/>
      <line x1="50" y1="50" x2="550" y2="50" stroke="#ffffff" stroke-width="0.5" stroke-dasharray="2,2"/>
    </g>

    <text x="45" y="250" font-family="Arial, sans-serif" font-size="10" fill="#ffffff" text-anchor="end">0</text>
    <text x="45" y="210" font-family="Arial, sans-serif" font-size="10" fill="#ffffff" text-anchor="end">20</text>
    <text x="45" y="170" font-family="Arial, sans-serif" font-size="10" fill="#ffffff" text-anchor="end">40</text>
    <text x="45" y="130" font-family="Arial, sans-serif" font-size="10" fill="#ffffff" text-anchor="end">60</text>
    <text x="45" y="90" font-family="Arial, sans-serif" font-size="10" fill="#ffffff" text-anchor="end">80</text>
    <text x="45" y="50" font-family="Arial, sans-serif" font-size="10" fill="#ffffff" text-anchor="end">100</text>

    <text x="90" y="270" font-family="Arial, sans-serif" font-size="9" fill="#ffffff" text-anchor="middle">2016</text>
    <text x="133.4" y="270" font-family="Arial, sans-serif" font-size="9" fill="#ffffff" text-anchor="middle">2017</text>
    <text x="176.8" y="270" font-family="Arial, sans-serif" font-size="9" fill="#ffffff" text-anchor="middle">2018</text>
    <text x="220.2" y="270" font-family="Arial, sans-serif" font-size="9" fill="#ffffff" text-anchor="middle">2019</text>
    <text x="263.6" y="270" font-family="Arial, sans-serif" font-size="9" fill="#ffffff" text-anchor="middle">2020</text>
    <text x="307" y="270" font-family="Arial, sans-serif" font-size="9" fill="#ffffff" text-anchor="middle">2021</text>
    <text x="350.4" y="270" font-family="Arial, sans-serif" font-size="9" fill="#ffffff" text-anchor="middle">2022</text>
    <text x="393.8" y="270" font-family="Arial, sans-serif" font-size="9" fill="#ffffff" text-anchor="middle">2023</text>
    <text x="437.2" y="270" font-family="Arial, sans-serif" font-size="9" fill="#ffffff" text-anchor="middle">2024</text>
    <text x="480.6" y="270" font-family="Arial, sans-serif" font-size="9" fill="#ffffff" text-anchor="middle">2025</text>
    <text x="524" y="270" font-family="Arial, sans-serif" font-size="9" fill="#ffffff" text-anchor="middle">2026</text>

    <!-- 年度引用柱状图 -->
    <rect x="82" y="242" width="16" height="8" fill="#ff3333"/>
    <rect x="125.4" y="194" width="16" height="56" fill="#ff3333"/>
    <rect x="168.8" y="174" width="16" height="76" fill="#ff3333"/>
    <rect x="212.2" y="170" width="16" height="80" fill="#ff3333"/>
    <rect x="255.6" y="160" width="16" height="90" fill="#ff3333"/>
    <rect x="299" y="162" width="16" height="88" fill="#ff3333"/>
    <rect x="342.4" y="122" width="16" height="128" fill="#ff3333"/>
    <rect x="385.8" y="88" width="16" height="162" fill="#ff3333"/>
    <rect x="429.2" y="58" width="16" height="192" fill="#ff3333"/>
    <rect x="472.6" y="72" width="16" height="178" fill="#ff3333"/>
    <rect x="516" y="106" width="16" height="144" fill="#ff3333"/>

    <!-- 年度引用数标签 -->
    <text x="90" y="237" font-family="Arial, sans-serif" font-size="9" fill="#ffffff" text-anchor="middle">4</text>
    <text x="133.4" y="189" font-family="Arial, sans-serif" font-size="9" fill="#ffffff" text-anchor="middle">28</text>
    <text x="176.8" y="169" font-family="Arial, sans-serif" font-size="9" fill="#ffffff" text-anchor="middle">38</text>
    <text x="220.2" y="165" font-family="Arial, sans-serif" font-size="9" fill="#ffffff" text-anchor="middle">40</text>
    <text x="263.6" y="155" font-family="Arial, sans-serif" font-size="9" fill="#ffffff" text-anchor="middle">45</text>
    <text x="307" y="157" font-family="Arial, sans-serif" font-size="9" fill="#ffffff" text-anchor="middle">44</text>
    <text x="350.4" y="117" font-family="Arial, sans-serif" font-size="9" fill="#ffffff" text-anchor="middle">64</text>
    <text x="393.8" y="83" font-family="Arial, sans-serif" font-size="9" fill="#ffffff" text-anchor="middle">81</text>
    <text x="437.2" y="53" font-family="Arial, sans-serif" font-size="9" fill="#ffffff" text-anchor="middle">96</text>
    <text x="480.6" y="67" font-family="Arial, sans-serif" font-size="9" fill="#ffffff" text-anchor="middle">89</text>
    <text x="524" y="101" font-family="Arial, sans-serif" font-size="9" fill="#ffffff" text-anchor="middle">72</text>

    <text x="300" y="290" font-family="Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle">Year</text>
    <text x="15" y="150" font-family="Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" transform="rotate(-90, 15, 150)">Citations</text>
  </g>

