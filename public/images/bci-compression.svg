<svg width="300" height="160" viewBox="0 0 300 160" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Event-based neural compression</title><desc id="desc">Dense neural signals become a sparse address-event packet stream.</desc>
